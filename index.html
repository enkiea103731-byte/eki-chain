<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EKI CHAIN - Minerar $EKI</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;margin:0;padding:15px}
.logo{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#FFD700,#FF8C00);margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:40px}
h1{color:#FFD700;margin:5px}.card{background:#141414;border:1px solid #333;border-radius:15px;padding:15px;margin:12px auto;max-width:480px}
button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:bold;font-size:16px;margin:6px 0;cursor:pointer}
.yellow{background:#FFD700;color:#000}.purple{background:#8b5cf6;color:#fff}.dark{background:#222;color:#fff;border:1px solid #444}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#000;color:#fff;margin:6px 0;box-sizing:border-box}
#addr{word-break:break-all;color:#7CFC00;font-size:13px}
</style></head><body>
<div class="logo">E</div><h1>EKI CHAIN</h1><p>Chain 70101 | $EKI | 100% Brasileira</p>

<div class="card">
<b>💰 SEU SALDO MINERADO</b><h2 id="bal" style="color:#FFD700">0.00 $EKI</h2>
<p id="addr">Carteira não conectada</p>
<p id="status" style="color:#aaa">Conecte qualquer carteira abaixo</p>
<button class="yellow" onclick="startMine()">▶ INICIAR MINERAÇÃO</button>
<button class="dark" onclick="stopMine()">⏹ PARAR</button>
<p id="mineInfo">Hash: 0 | Velocidade: 1.00 $EKI / hora</p>
</div>

<div class="card"><b>🔌 CONECTAR CARTEIRA - TODAS</b>
<button class="yellow" onclick="connectEVM('MetaMask')">🦊 MetaMask</button>
<button class="yellow" onclick="connectEVM('Trust Wallet')">🛡️ Trust Wallet</button>
<button class="yellow" onclick="connectEVM('Coinbase')">🔵 Coinbase Wallet</button>
<button class="purple" onclick="connectSolana('Phantom')">👻 Phantom</button>
<button class="purple" onclick="connectSolana('Solflare')">☀️ Solflare</button>
<button class="dark" onclick="connectAny()">🌐 QUALQUER OUTRA CARTEIRA</button>
<button class="dark" onclick="disconnect()">❌ Desconectar</button>
</div>

<div class="card"><b>📤 Enviar $EKI</b>
<input id="to" placeholder="Endereço destino 0x..."><input id="amt" type="number" placeholder="Quantidade">
<button class="yellow" onclick="sendEKI()">ENVIAR AGORA</button>
<p id="sendMsg"></p></div>

<div class="card"><b>🔁 Swap $EKI / USDT</b>
<input id="swapAmt" type="number" placeholder="Qtd $EKI"><button class="purple" onclick="swap()">TROCAR POR USDT (Simulado)</button><p id="swapMsg"></p></div>

<div class="card"><b>📦 Últimos Blocos</b><p id="blocks">Bloco #70101 - Minerado agora</p></div>

<script>
let bal = parseFloat(localStorage.getItem('eki_bal')||'0');
let mining=false, timer=null, hashes=0, userAddr='';
const EKI_CHAIN={chainId:'0x111D5',chainName:'EKI Chain',nativeCurrency:{name:'EKI',symbol:'EKI',decimals:18},rpcUrls:['https://eki-chain.onrender.com/'],blockExplorerUrls:['https://eki-chain.onrender.com/']};
function render(){document.getElementById('bal').innerText=bal.toFixed(2)+' $EKI';}
render();
async function connectEVM(name){
  try{
    if(!window.ethereum){ alert(name+' não encontrada. Abra o app da '+name+' e abra o site DENTRO do navegador dela (DApp Browser).'); window.open('https://metamask.app.link/dapp/eki-chain.onrender.com/','_blank'); return; }
    const acc=await window.ethereum.request({method:'eth_requestAccounts'});
    userAddr=acc[0];
    try{ await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:'0x111D5'}]}); }catch(e){ if(e.code===4902){ await window.ethereum.request({method:'wallet_addEthereumChain',params:[EKI_CHAIN]}); } }
    document.getElementById('addr').innerText='✅ '+name+': '+userAddr;
    document.getElementById('status').innerText='Conectado na EKI Chain 70101';
  }catch(e){ alert('Erro: '+e.message); }
}
async function connectSolana(name){
  try{
    const prov = window.solana || window.phantom?.solana;
    if(!prov || !prov.isPhantom){ alert(name+' não encontrada. Abra o site dentro do app da '+name+'.'); return; }
    const r=await prov.connect(); userAddr=r.publicKey.toString();
    document.getElementById('addr').innerText='✅ '+name+' (Solana): '+userAddr;
    document.getElementById('status').innerText='Conectado via Solana';
  }catch(e){ alert('Erro: '+e.message); }
}
async function connectAny(){
  if(window.ethereum) return connectEVM('Carteira EVM');
  if(window.solana) return connectSolana('Carteira Solana');
  alert('Nenhuma carteira detectada. Abra esse site DENTRO do app da sua carteira: MetaMask > Navegador > eki-chain.onrender.com');
}
function disconnect(){ userAddr=''; document.getElementById('addr').innerText='Carteira não conectada'; document.getElementById('status').innerText='Desconectado'; }
function startMine(){ if(mining) return; mining=true; document.getElementById('mineInfo').innerText='Minerando...'; timer=setInterval(()=>{ hashes++; bal+=0.00027; localStorage.setItem('eki_bal',bal); render(); document.getElementById('mineInfo').innerText='Hash: '+hashes+' | Minerando... +'+bal.toFixed(4)+' $EKI'; document.getElementById('blocks').innerText='Bloco #'+(70101+hashes)+' - Minerado agora'; },1000); }
function stopMine(){ mining=false; clearInterval(timer); document.getElementById('mineInfo').innerText='Parado. Total: '+bal.toFixed(2)+' $EKI'; }
function sendEKI(){ const to=document.getElementById('to').value, amt=parseFloat(document.getElementById('amt').value); if(!userAddr) return alert('Conecte a carteira primeiro'); if(!to||!amt) return alert('Preencha destino e valor'); if(amt>bal) return alert('Saldo insuficiente'); bal-=amt; localStorage.setItem('eki_bal',bal); render(); document.getElementById('sendMsg').innerText='✅ Enviado '+amt+' $EKI para '+to.slice(0,10)+'...'; }
function swap(){ const a=parseFloat(document.getElementById('swapAmt').value); if(!a) return alert('Digite a quantidade'); document.getElementById('swapMsg').innerText='✅ '+a+' $EKI = $'+(a*0.10).toFixed(2)+' USDT (simulado, taxa 0%)'; }
</script></body></html>
